<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="description" content="하나씩 늘어나는 미니 게임 모음. 설치 없이 바로 플레이하고, 게임마다 랭킹에 도전하세요." />
    <meta name="theme-color" content="#f5f2ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13101f" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="pwa-192x192.png?v=2" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="조이팩" />
    <!-- 링크 미리보기(카카오톡·메신저·SNS). 스크래퍼는 상대 경로를 못 읽으므로 배포 주소를 그대로 적는다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="조이팩" />
    <meta property="og:title" content="조이팩 — 미니 게임 모음" />
    <meta property="og:description" content="업다운, 두더지잡기… 하나씩 늘어나는 미니 게임 모음" />
    <meta property="og:url" content="https://myong558.github.io/project-joypack/" />
    <meta property="og:image" content="https://myong558.github.io/project-joypack/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="조이팩 — 미니 게임 모음" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // 첫 화면을 그리기 전에 컬러 모드를 적용해 깜빡임을 막는다(src/settings.ts 의 applyTheme 과 같은 규칙).
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('joypack.theme') || localStorage.getItem('updown.theme');
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
      // 오늘의 톤(스킨): 5개 중 날짜마다 하나. 같은 날은 모두 같은 톤이고, 이틀 연속 같은 톤은 나오지 않는다.
      // 5일씩 묶어 그 묶음 안에서 5개를 섞은 순서대로 쓴다(앞 묶음 마지막 날과 겹치면 첫 두 날을 바꿈).
      // 사용자가 고르는 설정은 없다. joypack.hubSkin 은 개발 중 톤 확인용 임시 값(src/skins.ts, 곧 삭제).
      (function () {
        var SKINS = ['grape', 'candy', 'soda', 'lemon', 'mint'];
        function hash(n) {
          n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
          n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
          return (n ^ (n >>> 16)) >>> 0;
        }
        function order(block) {
          var list = SKINS.slice();
          for (var i = list.length - 1; i > 0; i--) {
            var j = hash(block * 31 + i) % (i + 1);
            var tmp = list[i];
            list[i] = list[j];
            list[j] = tmp;
          }
          return list;
        }
        function skinOf(day) {
          var block = Math.floor(day / 5);
          var list = order(block);
          if (list[0] === order(block - 1)[4]) {
            var tmp = list[0];
            list[0] = list[1];
            list[1] = tmp;
          }
          return list[day - block * 5];
        }
        var now = new Date();
        var today = skinOf(Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 864e5));
        var preview = null;
        try {
          preview = localStorage.getItem('joypack.hubSkin');
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.skinToday = today;
        root.dataset.skin = SKINS.indexOf(preview) >= 0 ? preview : today;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
