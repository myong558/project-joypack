<!doctype html>
<html lang="ko" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>타임 투 플립</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="조이팩" />
    <meta name="theme-color" content="#0b7785" />
    <meta name="description" content="시간이 다 가기 전에 짝을 찾아라! 맞힐수록 시간이 늘어나는 카드 짝 맞추기 게임" />
    <!-- 링크 미리보기(카카오톡·메신저·SNS). 스크래퍼는 상대 경로를 못 읽으므로 배포 주소를 그대로 적는다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="타임 투 플립" />
    <meta property="og:title" content="타임 투 플립 ⏱️" />
    <meta property="og:description" content="시간이 다 가기 전에 짝을 찾아라! 맞힐수록 시간이 늘어나는 카드 짝 맞추기" />
    <meta property="og:url" content="https://myong558.github.io/project-joypack/games/timetoflip/" />
    <meta property="og:image" content="https://myong558.github.io/project-joypack/games/timetoflip/og-image.png?v=4" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="타임 투 플립 게임 화면" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // 첫 화면 깜빡임 방지: 공통 컬러 모드(joypack.theme)를 그리기 전에 적용한다
      try {
        var th = localStorage.getItem('joypack.theme');
        if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
