<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 타임 투 플립 아이콘: 진한 남보라 둥근 네모(시작 화면 제목 카드와 같은 색, 허브 카드 청록 그림판과 구분) 위에
       뒤집히는 카드 두 장(조이팩 얼굴 뒷면 + 달 앞면)과 남은 시간 막대 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f2a4a"/>
      <stop offset="1" stop-color="#15121f"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc533"/>
      <stop offset="1" stop-color="#f2a300"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="rotate(-10 21 29)">
    <rect x="9" y="13" width="24" height="32" rx="5" fill="url(#back)"/>
    <g fill="#3d2a00">
      <rect x="13.5" y="24" width="7" height="2.6" rx="1"/>
      <rect x="15.7" y="21.8" width="2.6" height="7" rx="1"/>
      <circle cx="27" cy="25.3" r="2.6"/>
    </g>
    <path d="M15 32q6 6 12 0" fill="none" stroke="#3d2a00" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <g transform="rotate(9 42 28)">
    <rect x="30" y="12" width="24" height="32" rx="5" fill="#fffaf0"/>
    <path d="M45.5 20.5a8 8 0 1 0 2.8 12.4 7 7 0 0 1-2.8-12.4z" fill="#fbbf24"/>
  </g>
  <rect x="12" y="51" width="40" height="4" rx="2" fill="#fff" opacity=".25"/>
  <rect x="12" y="51" width="29" height="4" rx="2" fill="#2ad4e6"/>
</svg>
