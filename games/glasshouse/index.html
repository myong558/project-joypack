<!doctype html>
<html lang="ko" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>온실정원</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="조이팩" />
    <meta name="theme-color" content="#3b7a4a" />
    <meta name="description" content="화분을 밀어 창가 햇살 자리에 꽃을 피우는 온실 퍼즐. 판을 깰 때마다 식물 도감이 한 쪽씩 열려요" />
    <!-- 링크 미리보기(카카오톡·메신저·SNS). 스크래퍼는 상대 경로를 못 읽으므로 배포 주소를 그대로 적는다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="온실정원" />
    <meta property="og:title" content="온실정원 🌷" />
    <meta property="og:description" content="화분을 밀어 창가 햇살 자리에 꽃을 피우는 온실 퍼즐" />
    <meta property="og:url" content="https://myong558.github.io/project-joypack/games/glasshouse/" />
    <meta property="og:image" content="https://myong558.github.io/project-joypack/games/glasshouse/og-image.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="온실정원 게임 화면" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // 첫 화면 깜빡임 방지: 공통 컬러 모드(joypack.theme)를 그리기 전에 적용한다
      try {
        var th = localStorage.getItem('joypack.theme');
        if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
