<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f66ff">
  <meta name="description" content="서버 없이 즐기는 숫자 맞추기 업다운 게임">
  <!-- 메신저 링크 미리보기(공유한 게임 링크). 미리보기 이미지는 절대 주소여야 해서 배포 주소를 쓴다. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="업다운 게임">
  <meta property="og:description" content="서버 없이 즐기는 숫자 맞추기 업다운 게임">
  <meta property="og:url" content="https://pocketgamelab.com/joyfield/games/updown/">
  <meta property="og:image" content="https://pocketgamelab.com/joyfield/games/updown/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="업다운 게임 — 숫자를 맞혀 보세요! UP? DOWN?">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="조이필드">
  <title>업다운 게임</title>
  <!-- 앱 설치는 조이필드 하나로 한다(manifest·서비스 워커는 사이트 루트에 있음, vite.config.ts 가 manifest 링크를 넣음). -->
  <!-- 탭 아이콘은 SVG 를 쓰고, SVG 탭 아이콘을 지원하지 않는 브라우저(구형 Safari 등)는 PNG 를 쓴다. -->
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="images/icon.svg">
  <!-- 아이폰 홈 화면 아이콘은 SVG 를 지원하지 않아 PNG 사본을 쓴다. -->
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <script>
    // 첫 화면을 그리기 전에 컬러 모드·계절 스킨을 적용해 깜빡임을 막는다.
    // src/main.ts 의 applyTheme, src/skins.ts 의 dailySkin 과 같은 규칙(기본은 기기 설정 · 날마다 무작위 스킨, 연속 같은 스킨 없음).
    (function () {
      var root = document.documentElement;
      var themePref = 'system';
      var skin = null;
      try {
        // 공통 설정(joyfield.theme)을 먼저, 없으면 예전 키(updown.theme)를 본다. Joyfield.get 과 같은 규칙.
        themePref = localStorage.getItem('joyfield.theme') || localStorage.getItem('updown.theme') || 'system';
        skin = localStorage.getItem('updown.skin');
      } catch (e) {}
      if (themePref === 'dark' || (themePref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        root.dataset.theme = 'dark';
      }
      var skins = ['spring', 'summer', 'autumn', 'winter'];
      // 자동: 공통 규칙 Joyfield.dailyPick('updown', …)(아래 함수는 그 글자 그대로의 복사본. 날마다 무작위, 이틀 연속 같은 스킨 없음)
      /* dailyPick: begin — 허브·업다운 index.html 의 첫 화면 스크립트에 같은 글자 그대로 복사돼 있다(packages/shared/tests 가 같은지 검사) */
      function dailyPick(salt, count, date) {
        date = date || new Date();
        var day = Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 864e5);
        if (count < 2) return 0;
        var seed = 2166136261;
        for (var c = 0; c < salt.length; c++) seed = Math.imul(seed ^ salt.charCodeAt(c), 16777619);
        function mix(n) {
          n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
          n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
          return (n ^ (n >>> 16)) >>> 0;
        }
        function order(block) {
          var list = [];
          for (var k = 0; k < count; k++) list.push(k);
          for (var i = count - 1; i > 0; i--) {
            var j = mix((seed + block * 31 + i) | 0) % (i + 1);
            var tmp = list[i];
            list[i] = list[j];
            list[j] = tmp;
          }
          return list;
        }
        // 두 개면 번갈아(묶음 경계 바꾸기가 다음 묶음과 겹칠 수 있어 따로)
        if (count === 2) return (day + (mix(seed) & 1)) % 2;
        var block = Math.floor(day / count);
        var list = order(block);
        if (list[0] === order(block - 1)[count - 1]) {
          var t0 = list[0];
          list[0] = list[1];
          list[1] = t0;
        }
        return list[day - block * count];
      }
      /* dailyPick: end */
      if (skins.indexOf(skin) < 0) skin = skins[dailyPick('updown', skins.length)];
      root.dataset.skin = skin;
      // PC 화면 확대 배수(css 의 --pc-zoom): 내용이 화면 위아래를 채우도록 화면 높이 / 600 으로 키우되,
      // 확대 뒤 가상 폭이 900px(PC 배치 기준) 아래로 내려가지 않게 한다. 휴대폰 배치에서는 쓰지 않는다.
      function fitZoom() {
        var zoom = Math.max(1, Math.min(window.innerHeight / 600, window.innerWidth / 900));
        root.style.setProperty('--pc-zoom', zoom.toFixed(3));
      }
      fitZoom();
      window.addEventListener('resize', fitZoom);
      // 화면 높이의 1%(css 의 --vh 기준값). 간격·카드 크기가 이 값을 따르므로, 처음 연 높이로 정해 두고
      // 폭이 바뀔 때(회전 등)와 PC 창 크기를 바꿀 때만 다시 잰다. 설치 앱에서 1~2초 뒤 상태 표시줄·내비게이션 바 자리가
      // 정리되며 높이만 바뀌면 난이도 카드 높이와 로고 위치가 덜컥 움직였다(그동안은 화면 안쪽 스크롤로 맞춘다)
      var vhWidth = 0;
      function fitVh(force) {
        var pc = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        if (!force && !pc && window.innerWidth === vhWidth) return;
        vhWidth = window.innerWidth;
        root.style.setProperty('--vh-px', (window.innerHeight / 100).toFixed(2) + 'px');
      }
      fitVh(true);
      window.addEventListener('resize', function () { fitVh(false); });
      // 주소창·상태바 색도 바로 맞춘다(스타일시트는 이 스크립트보다 먼저 읽힌다).
      var bg = getComputedStyle(root).getPropertyValue('--bg').trim();
      if (bg) document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
    })();
  </script>
</head>
<body>
  <!-- 화면 틀·아이콘은 src/ui/screens.ts·icons.ts 가 채운다. 글자를 다 채운 뒤 .booting 을 지워 보인다 -->
  <main id="app" class="app intro booting"></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
