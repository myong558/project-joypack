  <!-- 앱 설치는 조이팩 하나로 한다(manifest·서비스 워커는 사이트 루트에 있음). -->
  <link rel="manifest" href="../../manifest.webmanifest">
  <!-- 탭 아이콘은 SVG 를 쓰고, SVG 탭 아이콘을 지원하지 않는 브라우저(구형 Safari 등)는 PNG 를 쓴다. -->
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="images/icon.svg">
  <!-- 아이폰 홈 화면 아이콘은 SVG 를 지원하지 않아 PNG 사본을 쓴다. -->
  <link rel="apple-touch-icon" href="images/icon-192.png">

  <link rel="stylesheet" href="../../shared/topbar.css">

  <script>
    // 첫 화면을 그리기 전에 컬러 모드·계절 스킨을 적용해 깜빡임을 막는다.
    // js/app.js 의 applyTheme, js/skins.js 의 dailySkin 과 같은 규칙(기본은 기기 설정 · 날마다 무작위 스킨).
    (function () {
      var root = document.documentElement;
      var themePref = 'system';
      var skin = null;
      try {
        // 공통 설정(joypack.theme)을 먼저, 없으면 예전 키(updown.theme)를 본다. Joypack.get 과 같은 규칙.
        themePref = localStorage.getItem('joypack.theme') || localStorage.getItem('updown.theme') || 'system';
        skin = localStorage.getItem('updown.skin');
      } catch (e) {}
      if (themePref === 'dark' || (themePref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        root.dataset.theme = 'dark';
      }
      var skins = ['spring', 'summer', 'autumn', 'winter'];
      if (skins.indexOf(skin) < 0) {
        var now = new Date();
        var x = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000;
        x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
        x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
        x ^= x >>> 16;
        skin = skins[(x >>> 0) % skins.length];
      }
      root.dataset.skin = skin;
      // PC 화면 확대 배수(css 의 --pc-zoom): 내용이 화면 위아래를 채우도록 화면 높이 / 600 으로 키우되,
      // 확대 뒤 가상 폭이 900px(PC 배치 기준) 아래로 내려가지 않게 한다. 휴대폰 배치에서는 쓰지 않는다.
      function fitZoom() {
        var zoom = Math.max(1, Math.min(window.innerHeight / 600, window.innerWidth / 900));
        root.style.setProperty('--pc-zoom', zoom.toFixed(3));
      }
      fitZoom();
      window.addEventListener('resize', fitZoom);
      // 화면 높이의 1%(css 의 --vh 기준값). 간격·카드 크기가 이 값을 따르므로, 처음 연 높이로 정해 두고
      // 폭이 바뀔 때(회전 등)와 PC 창 크기를 바꿀 때만 다시 잰다. 설치 앱에서 1~2초 뒤 상태 표시줄·내비게이션 바 자리가
      // 정리되며 높이만 바뀌면 난이도 카드 높이와 로고 위치가 덜컥 움직였다(그동안은 화면 안쪽 스크롤로 맞춘다)
      var vhWidth = 0;
      function fitVh(force) {
        var pc = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        if (!force && !pc && window.innerWidth === vhWidth) return;
        vhWidth = window.innerWidth;
        root.style.setProperty('--vh-px', (window.innerHeight / 100).toFixed(2) + 'px');
      }
      fitVh(true);
      window.addEventListener('resize', function () { fitVh(false); });
      // 주소창·상태바 색도 바로 맞춘다(스타일시트는 이 스크립트보다 먼저 읽힌다).
      var bg = getComputedStyle(root).getPropertyValue('--bg').trim();
      if (bg) document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
    })();
  </script>
</head>

         공통 그림(Joypack.topIcon)을 넣는다. 랭킹·설정은 아이콘만 두고 이름은 aria-label 로 읽힌다. -->
    <!-- 위 메뉴 줄도 공통(.jp-topbar): 조이팩·다른 게임과 같은 자리(화면 맨 위 고정)라 넘어올 때 버튼이 움직이지 않는다. -->

        <h1 data-i18n="app.title"></h1>
      </div>
      <div id="difficulty-list" class="difficulty-list"></div>
    </section>

    <section id="screen-play" class="screen" hidden>
      <div class="status">
        <!-- 라벨 글자 대신 아이콘으로 보여주고, 화면 읽기용 이름은 aria-label 로 준다. -->
        <div class="status-item status-range" role="group" data-i18n-aria-label="play.range">
          <svg class="icon status-icon" aria-hidden="true"><use href="#i-range"></use></svg>
          <span id="range" class="status-value"></span>
        </div>
        <div class="status-item status-tries" role="group" data-i18n-aria-label="play.triesLabel">
          <svg class="icon status-icon" aria-hidden="true"><use href="#i-retry"></use></svg>
          <span id="tries-count" class="status-value"></span>
        </div>
        <!-- 좁혀지는 숫자 막대: 처음 범위 전체 중 아직 가능한 칸만 밝게 남고, 추측한 자리에 눈금이 찍힌다(app.js 의 renderBar). -->
        <div id="range-bar" class="range-bar" aria-hidden="true">
          <span id="range-bar-live" class="range-bar-live"></span>
        </div>
        <p id="play-level" class="play-level"></p>
      </div>

      <div class="hint-box" aria-live="polite">
        <p id="hint-value" class="hint-value"></p>
        <p id="hint" class="hint"></p>
        <!-- 온도계: 한 판에 한 번, 방금 넣은 숫자가 정답과 얼마나 가까운지(🔥 아주 가까움 ~ ❄️ 멂). 쓰면 점수 차감.
             누르면 설명과 [사용하기]가 있는 창(#thermo)이 뜨고, 쓴 뒤에는 이 자리에 그 온도가 남는다(app.js 의 renderThermo). -->
        <p class="temp-row">
          <button id="thermo-open" type="button" class="thermo-open">
            <svg class="icon" aria-hidden="true"><use href="#i-thermo"></use></svg>
            <span id="thermo-open-label"></span>
          </button>
          <span id="temp" class="temp" hidden></span>
        </p>
      </div>

      <!-- 시도 기록은 숫자 상자 위에서 위로 쌓인다. 다이얼은 화면 맨 아래에 고정돼 기록이 늘어도 움직이지 않는다. -->
      <ol id="history" class="history" data-i18n-aria-label="play.history"></ol>

      <!-- 숫자는 110° 원호 다이얼로만 고른다. 위 상자에 고른 숫자가 보이고 -/+ 로 1씩 조정한다.
           다이얼 범위는 힌트로 좁혀진 범위를 따르고(왼쪽 끝 = 최솟값), 확인 버튼은 원호 안쪽에 있다. 원호 경로는 app.js 가 그린다. -->
      <form id="guess-form" class="guess-form" novalidate>
        <div class="pick">
          <button id="pick-down" type="button" class="pick-step" data-i18n-aria-label="play.minus"><svg class="icon" aria-hidden="true"><use href="#i-minus"></use></svg></button>
          <output id="pick-value" class="pick-value"></output>
          <button id="pick-up" type="button" class="pick-step" data-i18n-aria-label="play.plus"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg></button>
        </div>
        <div class="dial">
          <svg id="dial" class="dial-svg" viewBox="0 0 300 105" role="slider" tabindex="0" data-i18n-aria-label="play.inputLabel">
            <path class="dial-track"/>
            <path id="dial-fill" class="dial-fill"/>
            <circle id="dial-thumb" class="dial-thumb" r="15"/>
          </svg>
          <button type="submit" class="dial-submit" data-i18n="play.submit"></button>
        </div>
      </form>
    </section>

    <section id="screen-result" class="screen" hidden>
      <div id="result-art" class="result-art" aria-hidden="true">
        <svg class="sparkle sparkle-1"><use href="#i-sparkle"></use></svg>
        <svg id="result-icon" class="result-icon"><use href="#i-trophy"></use></svg>
        <svg class="sparkle sparkle-2"><use href="#i-sparkle"></use></svg>
      </div>
      <h1 id="result-title"></h1>
      <p id="result-answer" class="answer"></p>
      <p id="result-score" class="result-score"></p>
      <p id="result-detail" class="lead"></p>
      <p id="result-thermo" class="result-thermo" hidden></p>
      <p id="result-practice" class="result-practice" hidden data-i18n="result.practice"></p>
      <p id="result-best" class="new-best" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-star"></use></svg>
        <span data-i18n="result.newBest"></span>
      </p>
      <!-- 랭킹 등록 칸: TOP 10 에 들면 축하 아래에 펼쳐진다(app.js 의 renderResultRank). 팝업을 열지 않고 바로 등록하고,
           등록하면 "N위로 등록했어요 + 랭킹 보기"로 바뀐다. 등록하지 않고 넘어가도 위 [랭킹 등록] 버튼으로 나중에 할 수 있다. -->
      <!-- 랭킹 등록 + 버튼 묶음. 세로 화면에서는 display: contents 라 없는 것과 같고, 가로로 눕힌 낮은 화면에서 오른쪽 칸이 된다(style.css) -->
      <div class="result-side">
      <form id="result-rank" class="result-rank" hidden novalidate>
        <p id="result-rank-prompt" class="result-rank-prompt"></p>
        <div class="ranking-entry">
          <input id="result-rank-initials" class="ranking-input" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="email" lang="en" enterkeyhint="done" data-i18n-placeholder="ranking.initials" data-i18n-aria-label="ranking.initials">
          <button id="result-rank-submit" type="submit" class="primary" data-i18n="ranking.submit"></button>
        </div>
        <button id="result-rank-view" type="button" class="secondary result-rank-view">
          <svg class="icon" aria-hidden="true"><use href="#i-trophy"></use></svg>
          <span data-i18n="ranking.view"></span>
        </button>
      </form>
      <div class="actions">
        <button id="retry" type="button" class="primary">
          <svg class="icon" aria-hidden="true"><use href="#i-retry"></use></svg>
          <span data-i18n="result.retry"></span>
        </button>
        <!-- 기록 공유하기: 결과 카드 이미지 + 조이팩 설치 주소(app.js 의 shareResult → Joypack.shareResult). -->
        <div class="action-row">
          <button id="share" type="button" class="secondary">
            <svg class="icon" aria-hidden="true"><use href="#i-share"></use></svg>
            <span data-i18n="result.share"></span>
          </button>
          <button id="go-home" type="button" class="secondary">
            <svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg>
            <span data-i18n="result.home"></span>
          </button>
        </div>
      </div>
      </div>
      <p id="toast" class="toast" role="status" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="settings" class="settings" aria-labelledby="settings-title">
    <div class="settings-body">
      <div class="settings-header">
        <h2 id="settings-title" data-i18n="settings.title"></h2>
        <button id="settings-close" type="button" class="icon-button" data-i18n-aria-label="settings.close">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>

      <section class="settings-group">
        <h3 data-i18n="settings.theme"></h3>
        <div class="chip-row theme-row">
          <button type="button" class="chip" data-theme-option="system">
            <svg class="icon" aria-hidden="true"><use href="#i-auto"></use></svg>
            <span data-i18n="settings.system"></span>
          </button>
          <button type="button" class="chip" data-theme-option="light">
            <svg class="icon" aria-hidden="true"><use href="#i-sun"></use></svg>
            <span data-i18n="settings.light"></span>
          </button>
          <button type="button" class="chip" data-theme-option="dark">
            <svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg>
            <span data-i18n="settings.dark"></span>
          </button>
        </div>
      </section>

      <section class="settings-group">
        <h3 data-i18n="settings.skin"></h3>
        <div class="chip-row theme-row skin-row">
          <button type="button" class="chip" data-skin-option="auto">
            <svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg>
            <span data-i18n="skin.auto"></span>
          </button>
          <button type="button" class="chip" data-skin-option="spring">
            <svg class="icon" aria-hidden="true"><use href="#i-flower"></use></svg>
            <span data-i18n="skin.spring"></span>
          </button>
          <button type="button" class="chip" data-skin-option="summer">
            <svg class="icon" aria-hidden="true"><use href="#i-sun"></use></svg>
            <span data-i18n="skin.summer"></span>
          </button>
          <button type="button" class="chip" data-skin-option="autumn">
            <svg class="icon" aria-hidden="true"><use href="#i-leaf"></use></svg>
            <span data-i18n="skin.autumn"></span>
          </button>
          <button type="button" class="chip" data-skin-option="winter">
            <svg class="icon" aria-hidden="true"><use href="#i-snow"></use></svg>
            <span data-i18n="skin.winter"></span>
          </button>
        </div>
      </section>

      <!-- 언어와 효과음·진동은 팝업 높이를 늘리지 않도록 한 줄에 나란히 둔다. -->
      <div class="settings-pair">
        <section class="settings-group">
          <h3 data-i18n="settings.language"></h3>
          <div id="settings-lang" class="chip-row"></div>
        </section>

        <!-- 효과음·진동 켜기/끄기(js/fx.js). 아이콘 칩이 채워지면 켬, 빗금이 그어지면 끔.
             진동을 지원하지 않는 기기(아이폰 등)는 진동 칩을 숨긴다. -->
        <section class="settings-group">
          <h3 data-i18n="settings.fx"></h3>
          <div class="chip-row fx-row">
            <button id="fx-sound" type="button" class="chip">
              <svg class="icon" aria-hidden="true"><use href="#i-sound"></use></svg>
            </button>
            <button id="fx-vibrate" type="button" class="chip">
              <svg class="icon" aria-hidden="true"><use href="#i-vibrate"></use></svg>
            </button>
          </div>
        </section>
      </div>

      <section class="settings-group">
        <h3 data-i18n="settings.records"></h3>
        <!-- 범위별(1~50·1~100·1~200) 칩은 app.js 가 js/game.js 의 PRESETS 로 덧붙인다. -->
        <div id="reset-row" class="chip-row reset-row">
          <button type="button" class="chip" data-reset="all" data-i18n="settings.resetAll"></button>
        </div>
      </section>

      <!-- 지금 쓰는 버전(package.json version, 조이팩 빌드가 넣음). 새 버전이 반영됐는지 확인할 때 본다. -->
      <p id="app-version" class="app-version" hidden></p>
      <p id="app-copyright" class="app-copyright"></p>
    </div>
  </dialog>

  <!-- 직접 정하기: 끝 숫자만 고르는 연습 모드(시작 숫자는 1 고정, 랭킹 없음). 마지막으로 고른 값을 기억한다. -->
  <dialog id="custom" class="settings custom" aria-labelledby="custom-title">
    <form id="custom-form" class="settings-body" novalidate>
      <div class="settings-header">
        <h2 id="custom-title" data-i18n="custom.title"></h2>
        <button id="custom-close" type="button" class="icon-button" data-i18n-aria-label="settings.close">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>
      <p id="custom-desc" class="custom-desc"></p>
      <div class="custom-pick">
        <button id="custom-minus10" type="button" class="pick-step pick-step-ten" data-i18n-aria-label="custom.minus10">−10</button>
        <button id="custom-minus" type="button" class="pick-step" data-i18n-aria-label="custom.minus"><svg class="icon" aria-hidden="true"><use href="#i-minus"></use></svg></button>
        <span class="custom-range"><span aria-hidden="true">1 ~</span>
          <input id="custom-max" class="custom-input" type="number" inputmode="numeric" enterkeyhint="go" data-i18n-aria-label="custom.input">
        </span>
        <button id="custom-plus" type="button" class="pick-step" data-i18n-aria-label="custom.plus"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg></button>
        <button id="custom-plus10" type="button" class="pick-step pick-step-ten" data-i18n-aria-label="custom.plus10">+10</button>
      </div>
      <p class="custom-note" data-i18n="custom.note"></p>
      <button type="submit" class="primary">
        <svg class="icon" aria-hidden="true"><use href="#i-play"></use></svg>
        <span data-i18n="custom.start"></span>
      </button>
    </form>
  </dialog>

  <!-- 공유 랭킹(js/ranking.js): 범위별 TOP 10. 정답을 맞힌 직후에는 맨 위에 이니셜 등록 칸이 나온다. -->
  <dialog id="ranking" class="settings ranking" aria-labelledby="ranking-title">
    <div class="settings-body">
      <div class="settings-header">
        <h2 id="ranking-title" data-i18n="ranking.title"></h2>
        <button id="ranking-close" type="button" class="icon-button" data-i18n-aria-label="settings.close">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>

      <form id="ranking-form" class="ranking-form" hidden>
        <p id="ranking-prompt" class="ranking-prompt"></p>
        <div class="ranking-entry">
          <input id="ranking-initials" class="ranking-input" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="email" lang="en" enterkeyhint="done" data-i18n-placeholder="ranking.initials" data-i18n-aria-label="ranking.initials" required>
          <button id="ranking-submit" type="submit" class="primary" data-i18n="ranking.submit"></button>
        </div>
      </form>

      <div id="ranking-tabs" class="chip-row ranking-tabs"></div>
      <!-- 목록이 비면(불러오는 중·기록 없음·실패) 안내 문구는 목록 칸 가운데에 겹쳐 보인다. -->
      <div class="ranking-board">
        <ol id="ranking-list" class="ranking-list"></ol>
        <p id="ranking-status" class="ranking-status" role="status"></p>
      </div>
    </div>
  </dialog>

  <!-- 기록 리셋 확인 팝업. 설정 창 위에 한 겹 더 뜬다. 처음 포커스는 안전한 "취소"에 있다. -->
  <!-- 온도계 설명·사용 확인. 쓸 수 없을 때(아직 넣은 숫자가 없음·남은 숫자가 적음)는 이유와 [닫기]만 보인다 -->
  <dialog id="thermo" class="settings thermo" aria-labelledby="thermo-title">
    <div class="settings-body">
      <div class="settings-header">
        <h2 id="thermo-title"><svg class="icon" aria-hidden="true"><use href="#i-thermo"></use></svg><span data-i18n="thermo.title"></span></h2>
        <button id="thermo-close" type="button" class="icon-button" data-i18n-aria-label="settings.close">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>
      <p class="thermo-desc" data-i18n="thermo.desc"></p>
      <p class="thermo-scale" data-i18n="thermo.scale"></p>
      <ul id="thermo-rules" class="thermo-rules"></ul>
      <p id="thermo-block" class="thermo-block" role="status" hidden></p>
      <div class="confirm-actions">
        <button id="thermo-cancel" type="button" class="secondary"></button>
        <button id="thermo-use" type="button" class="primary"></button>
      </div>
    </div>
  </dialog>

  <dialog id="confirm" class="settings confirm" aria-describedby="confirm-message">
    <div class="settings-body">
      <span class="confirm-icon" aria-hidden="true">
        <svg class="icon"><use href="#i-trash"></use></svg>
      </span>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" type="button" class="secondary" data-i18n="confirm.cancel"></button>
        <button id="confirm-ok" type="button" class="danger-button" data-i18n="confirm.delete"></button>
      </div>
    </div>
  </dialog>

  <!-- 조이팩 공통 모듈(공통 설정·서비스 워커). 다른 스크립트보다 먼저 불러온다. -->
  <script src="../../shared/joypack.js"></script>
  <script src="js/game.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
