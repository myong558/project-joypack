name: Deploy to Cloudflare Pages

# main → 운영 https://pocketgamelab.com/joyfield/  (개발 DB 아님, 운영 DB joyfield-41b5a)
# dev  → 개발 https://dev.pocketgamelab.com/joyfield/ (개발 DB joyfield-dev, 검색 차단)
# DB 는 빌드가 아니라 주소를 보고 공통 모듈이 고른다(Joyfield.FIREBASE, README 4.4·4.5)
# 필요한 저장소 비밀값: CLOUDFLARE_API_TOKEN(Pages 편집 권한), CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          # dev 브랜치는 홈 화면 앱 이름을 "조이필드 개발"로(scripts/build.mjs 3-2)
          JOYFIELD_SITE: ${{ github.ref_name == 'dev' && 'dev' || '' }}
      - run: pnpm site
      # wrangler-action 은 저장소 루트(pnpm 작업 공간)에 wrangler 를 설치하려다 실패해서 pnpm dlx 로 따로 받아 쓴다
      - name: Deploy (wrangler pages deploy)
        run: pnpm dlx wrangler@4 pages deploy site --project-name=pocketgamelab --branch=${{ github.ref_name }} --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
