name: Deploy to Cloudflare Pages

# main → 운영 https://pocketgamelab.com/joyfield/  (개발 DB 아님, 운영 DB joyfield-41b5a)
# dev  → 개발 https://dev.pocketgamelab.com/joyfield/ (개발 DB joyfield-dev, 검색 차단)
# DB 는 빌드가 아니라 주소를 보고 공통 모듈이 고른다(Joyfield.FIREBASE, README 4.4·4.5)
# 필요한 저장소 비밀값: CLOUDFLARE_API_TOKEN(Pages 편집 권한), CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=pocketgamelab --branch=${{ github.ref_name }} --commit-dirty=true
