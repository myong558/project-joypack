name: Old address notice (GitHub Pages)

# 옛 주소 https://myong558.github.io/project-joyfield/ 를 "새 주소로 옮겼어요" 페이지로 바꾼다(README 4.5).
# 새 주소(https://pocketgamelab.com/joyfield/)가 잘 열리는 것을 확인한 뒤 Actions 탭에서 사람이 한 번 실행한다.
# 어떤 경로로 들어와도 같은 경로의 새 주소로 보내고, 옛 서비스 워커는 캐시를 비우고 스스로 해제한다.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 대기열(concurrency)은 두지 않는다: 2026-11-05 첫 실행이 GitHub 쪽에서 "queued" 로 멈춰 취소도 안 되자
# 같은 대기열(pages)을 쓰는 다음 실행까지 함께 막혔다. 손으로 한 번 돌리는 작업이라 대기열이 필요 없다

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/moved-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: moved

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
