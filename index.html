<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f66ff">
  <meta name="description" content="서버 없이 즐기는 숫자 맞추기 업다운 게임">
  <!-- 메신저 링크 미리보기(공유한 게임 링크). 미리보기 이미지는 절대 주소여야 해서 배포 주소를 쓴다. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="업다운 게임">
  <meta property="og:description" content="서버 없이 즐기는 숫자 맞추기 업다운 게임">
  <meta property="og:url" content="https://myong558.github.io/project-updown/">
  <meta property="og:image" content="https://myong558.github.io/project-updown/images/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="업다운">
  <title>업다운 게임</title>
  <link rel="manifest" href="manifest.webmanifest">
  <!-- 탭 아이콘은 SVG 를 쓰고, SVG 탭 아이콘을 지원하지 않는 브라우저(구형 Safari 등)는 PNG 를 쓴다. -->
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="images/icon.svg">
  <!-- 아이폰 홈 화면 아이콘은 SVG 를 지원하지 않아 PNG 사본을 쓴다. -->
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="preload" href="fonts/jua-subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 첫 화면을 그리기 전에 컬러 모드·계절 스킨을 적용해 깜빡임을 막는다.
    // js/app.js 의 applyTheme, js/skins.js 의 dailySkin 과 같은 규칙(기본은 기기 설정 · 날마다 무작위 스킨).
    (function () {
      var root = document.documentElement;
      var themePref = 'system';
      var skin = null;
      try {
        themePref = localStorage.getItem('updown.theme') || 'system';
        skin = localStorage.getItem('updown.skin');
      } catch (e) {}
      if (themePref === 'dark' || (themePref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        root.dataset.theme = 'dark';
      }
      var skins = ['spring', 'summer', 'autumn', 'winter'];
      if (skins.indexOf(skin) < 0) {
        var now = new Date();
        var x = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000;
        x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
        x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
        x ^= x >>> 16;
        skin = skins[(x >>> 0) % skins.length];
      }
      root.dataset.skin = skin;
      // PC 화면 확대 배수(css 의 --pc-zoom): 내용이 화면 위아래를 채우도록 화면 높이 / 600 으로 키우되,
      // 확대 뒤 가상 폭이 900px(PC 배치 기준) 아래로 내려가지 않게 한다. 휴대폰 배치에서는 쓰지 않는다.
      function fitZoom() {
        var zoom = Math.max(1, Math.min(window.innerHeight / 600, window.innerWidth / 900));
        root.style.setProperty('--pc-zoom', zoom.toFixed(3));
      }
      fitZoom();
      window.addEventListener('resize', fitZoom);
      // 주소창·상태바 색도 바로 맞춘다(스타일시트는 이 스크립트보다 먼저 읽힌다).
      var bg = getComputedStyle(root).getPropertyValue('--bg').trim();
      if (bg) document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
    })();
  </script>
</head>
<body>
  <!-- 아이콘 스프라이트. <svg class="icon"><use href="#i-이름"></use></svg> 로 쓰며, 색은 글자색(currentColor)을 따른다. -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-up" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l8.5 10H15v8H9v-8H3.5z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21l8.5-10H15V3H9v8H3.5z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path fill="currentColor" d="M7 3h10v6a5 5 0 0 1-10 0z"/>
        <path d="M7 5H4v1a4 4 0 0 0 4 4M17 5h3v1a4 4 0 0 1-4 4M12 14v4M8 21h8M9.5 18h5"/>
      </g>
    </symbol>
    <!-- 실패 얼굴: 어질어질한 X 눈, 삐뚤빼뚤한 입에 혀 내밀기, 진땀 한 방울 -->
    <symbol id="i-sad" viewBox="0 0 24 24">
      <!-- 얼굴 안쪽은 스킨의 옅은 톤(다이얼 트랙과 같은 색)으로 불투명하게 채워 뒤의 배경 입자가 비치지 않게 한다(바깥 원만 반투명). -->
      <circle cx="12" cy="12" r="9" style="fill: var(--range-track)"/>
      <path d="M12.9 15.9c0 3.4 3.9 3.4 3.9 0z" fill="#ff7a8a"/>
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M7.4 8.2l2.8 2.8M10.2 8.2l-2.8 2.8M13.8 8.2l2.8 2.8M16.6 8.2l-2.8 2.8"/>
        <path d="M7.6 15.8q1.1-1.2 2.2 0t2.2 0t2.2 0t2.2 0" stroke-width="1.8"/>
      </g>
      <path d="M20.3 1.6c1.1 1.5 1.7 2.5 1.7 3.3a1.7 1.7 0 0 1-3.4 0c0-.8.6-1.8 1.7-3.3z" fill="#73a8ff"/>
    </symbol>
    <symbol id="i-retry" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12a8 8 0 1 1-2.4-5.7"/>
        <path d="M20 4v5h-5"/>
      </g>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </g>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>
    </symbol>
    <symbol id="i-minus" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M6 12h12"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M6 12h12M12 6v12"/>
    </symbol>
    <symbol id="i-flower" viewBox="0 0 24 24">
      <g fill="currentColor">
        <circle cx="12" cy="6.5" r="3.6"/><circle cx="17.2" cy="10.3" r="3.6"/><circle cx="15.2" cy="16.4" r="3.6"/>
        <circle cx="8.8" cy="16.4" r="3.6"/><circle cx="6.8" cy="10.3" r="3.6"/>
      </g>
      <circle cx="12" cy="12" r="2.4" fill="#fff" opacity="0.85"/>
    </symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24">
      <path fill="currentColor" d="M20 3C10 3 4 8 4 15c0 1.6.4 3 1 4.2L3.6 20.6l1.4 1.4 1.5-1.5C7.6 21.5 9 22 10.8 22 17 22 21 15.5 20 3zM7.4 18.4c2-3.6 5-6.5 8.6-8.6-2.7 2.6-5 5.5-6.9 8.9z"/>
    </symbol>
    <!-- 눈 결정: 여섯 갈래 가지 끝마다 V 모양 잔가지 -->
    <symbol id="i-snow" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 12L12 2.5M9.41 4.49L12 6L14.59 4.49M12 12L20.23 7.25M17.21 6L17.2 9L19.8 10.49M12 12L20.23 16.75M19.8 13.51L17.2 15L17.21 18M12 12L12 21.5M14.59 19.51L12 18L9.41 19.51M12 12L3.77 16.75M6.79 18L6.8 15L4.2 13.51M12 12L3.77 7.25M4.2 10.49L6.8 9L6.79 6"/>
    </symbol>
    <!-- 스킨 자동: 날마다(달력) 스킨을 무작위로 고른다 -->
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/>
        <path d="M3.5 10h17M8 3v4M16 3v4"/>
      </g>
      <g fill="currentColor">
        <circle cx="8" cy="14" r="1.3"/><circle cx="12" cy="14" r="1.3"/><circle cx="16" cy="14" r="1.3"/><circle cx="8" cy="17.3" r="1.3"/><circle cx="12" cy="17.3" r="1.3"/>
      </g>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </symbol>
    <symbol id="i-auto" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path fill="currentColor" d="M12 3a9 9 0 0 1 0 18z"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4" fill="currentColor"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </g>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l9-7 9 7"/>
        <path d="M5 9.5V20h5v-6h4v6h5V9.5"/>
      </g>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>
      </g>
    </symbol>
    <symbol id="i-range" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M7 8l5-5 5 5M7 16l5 5 5-5"/>
    </symbol>
    <symbol id="i-heart" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.9 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.6l1 1.6 1-1.6c.8-1.4 2.3-2.6 4.4-2.6 3.7 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z"/>
    </symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2l1.9 6.6L20.5 10.5l-6.6 1.9L12 19l-1.9-6.6L3.5 10.5l6.6-1.9z"/>
    </symbol>
    <symbol id="i-globe" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9s1.3-6.3 3.8-9z"/>
      </g>
    </symbol>
    <symbol id="i-kakao" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 3.5c-5 0-9 3.2-9 7.1 0 2.5 1.6 4.7 4.1 5.9l-.9 3.4c-.1.3.3.6.6.4l4-2.6c.4 0 .8.1 1.2.1 5 0 9-3.2 9-7.2S17 3.5 12 3.5z"/>
    </symbol>
    <symbol id="i-share" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 14.5V3.5M7.5 7.5 12 3.5l4.5 4"/>
        <path d="M8.5 10.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6.5a2 2 0 0 0-2-2h-1.5"/>
      </g>
    </symbol>
  </svg>

  <!-- 문구는 js/i18n.js 에 있고, data-i18n* 속성의 키로 채워진다. -->
  <main class="app intro">
    <!-- 설정 버튼은 모든 화면 오른쪽 위에 보인다.
         왼쪽 위는 시작 화면이면 언어 전환, 게임 화면이면 홈 버튼이다. -->
    <div class="topbar">
      <button id="home" type="button" class="pill-button" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg>
        <span data-i18n="nav.home"></span>
      </button>
      <button id="lang-toggle" type="button" class="pill-button" data-i18n-aria-label="lang.switchLabel">
        <svg class="icon" aria-hidden="true"><use href="#i-globe"></use></svg>
        <span data-i18n="lang.switch"></span>
      </button>
      <button id="settings-open" type="button" class="pill-button" aria-haspopup="dialog">
        <svg class="icon" aria-hidden="true"><use href="#i-gear"></use></svg>
        <span data-i18n="settings.open"></span>
      </button>
    </div>

    <section id="screen-start" class="screen">
      <div class="brand">
        <!-- 로고(images/icon.svg 와 같은 그림). 인트로에서 위·아래 삼각형을 따로 움직이려고 문서 안에 직접 넣었다. -->
        <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
          <defs>
            <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d3c60"/><stop offset="1" stop-color="#161f38"/></linearGradient>
            <linearGradient id="logo-up" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2705f"/><stop offset="1" stop-color="#c63f34"/></linearGradient>
            <linearGradient id="logo-down" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa0ff"/><stop offset="1" stop-color="#3b74ea"/></linearGradient>
          </defs>
          <rect width="512" height="512" fill="url(#logo-bg)"/>
          <g stroke-width="24" stroke-linejoin="round">
            <path class="logo-up" d="M256 82 389 230H123z" fill="url(#logo-up)" stroke="url(#logo-up)"/>
            <path class="logo-down" d="M256 430 389 282H123z" fill="url(#logo-down)" stroke="url(#logo-down)"/>
          </g>
        </svg>
        <h1 data-i18n="app.title"></h1>
      </div>
      <div id="difficulty-list" class="difficulty-list"></div>
    </section>

    <section id="screen-play" class="screen" hidden>
      <div class="status">
        <!-- 라벨 글자 대신 아이콘으로 보여주고, 화면 읽기용 이름은 aria-label 로 준다. -->
        <div class="status-item status-range" role="group" data-i18n-aria-label="play.range">
          <svg class="icon status-icon" aria-hidden="true"><use href="#i-range"></use></svg>
          <span id="range" class="status-value"></span>
        </div>
        <div class="status-item status-tries">
          <span id="tries-left" class="hearts" role="img"></span>
        </div>
        <p id="play-level" class="play-level"></p>
      </div>

      <div class="hint-box" aria-live="polite">
        <p id="hint-value" class="hint-value"></p>
        <p id="hint" class="hint"></p>
      </div>

      <!-- 시도 기록은 숫자 상자 위에서 위로 쌓인다. 다이얼은 화면 맨 아래에 고정돼 기록이 늘어도 움직이지 않는다. -->
      <ol id="history" class="history" data-i18n-aria-label="play.history"></ol>

      <!-- 숫자는 110° 원호 다이얼로만 고른다. 위 상자에 고른 숫자가 보이고 -/+ 로 1씩 조정한다.
           다이얼 범위는 힌트로 좁혀진 범위를 따르고(왼쪽 끝 = 최솟값), 확인 버튼은 원호 안쪽에 있다. 원호 경로는 app.js 가 그린다. -->
      <form id="guess-form" class="guess-form" novalidate>
        <div class="pick">
          <button id="pick-down" type="button" class="pick-step" data-i18n-aria-label="play.minus"><svg class="icon" aria-hidden="true"><use href="#i-minus"></use></svg></button>
          <output id="pick-value" class="pick-value"></output>
          <button id="pick-up" type="button" class="pick-step" data-i18n-aria-label="play.plus"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg></button>
        </div>
        <div class="dial">
          <svg id="dial" class="dial-svg" viewBox="0 0 300 105" role="slider" tabindex="0" data-i18n-aria-label="play.inputLabel">
            <path class="dial-track"/>
            <path id="dial-fill" class="dial-fill"/>
            <circle id="dial-thumb" class="dial-thumb" r="15"/>
          </svg>
          <button type="submit" class="dial-submit" data-i18n="play.submit"></button>
        </div>
      </form>
    </section>

    <section id="screen-result" class="screen" hidden>
      <div id="result-art" class="result-art" aria-hidden="true">
        <svg class="sparkle sparkle-1"><use href="#i-sparkle"></use></svg>
        <svg id="result-icon" class="result-icon"><use href="#i-trophy"></use></svg>
        <svg class="sparkle sparkle-2"><use href="#i-sparkle"></use></svg>
      </div>
      <h1 id="result-title"></h1>
      <p id="result-answer" class="answer"></p>
      <p id="result-detail" class="lead"></p>
      <p id="result-best" class="new-best" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-star"></use></svg>
        <span data-i18n="result.newBest"></span>
      </p>
      <div class="actions">
        <button id="retry" type="button" class="primary">
          <svg class="icon" aria-hidden="true"><use href="#i-retry"></use></svg>
          <span data-i18n="result.retry"></span>
        </button>
        <!-- 공유하기: 결과 카드 이미지 + 게임 링크. 공유 창이 없는 브라우저는 이미지를 저장하고 링크를 복사한다(app.js 의 shareResult). -->
        <!-- 카카오톡 공유: 결과 이미지와 게임 링크 버튼이 한 메시지로 간다(app.js 의 shareKakao). 키가 없으면 숨긴다. -->
        <button id="share-kakao" type="button" class="kakao" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-kakao"></use></svg>
          <span data-i18n="result.shareKakao"></span>
        </button>
        <div class="action-row">
          <button id="share" type="button" class="secondary">
            <svg class="icon" aria-hidden="true"><use href="#i-share"></use></svg>
            <span data-i18n="result.share"></span>
          </button>
          <button id="go-home" type="button" class="secondary">
            <svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg>
            <span data-i18n="result.home"></span>
          </button>
        </div>
      </div>
      <p id="toast" class="toast" role="status" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="settings" class="settings" aria-labelledby="settings-title">
    <div class="settings-body">
      <div class="settings-header">
        <h2 id="settings-title" data-i18n="settings.title"></h2>
        <button id="settings-close" type="button" class="icon-button" data-i18n-aria-label="settings.close">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>

      <section class="settings-group">
        <h3 data-i18n="settings.records"></h3>
        <!-- 난이도별 칩은 app.js 가 js/game.js 의 난이도 목록으로 덧붙인다. -->
        <div id="reset-row" class="chip-row reset-row">
          <button type="button" class="chip" data-reset="all" data-i18n="settings.resetAll"></button>
        </div>
      </section>

      <section class="settings-group">
        <h3 data-i18n="settings.theme"></h3>
        <div class="chip-row theme-row">
          <button type="button" class="chip" data-theme-option="system">
            <svg class="icon" aria-hidden="true"><use href="#i-auto"></use></svg>
            <span data-i18n="settings.system"></span>
          </button>
          <button type="button" class="chip" data-theme-option="light">
            <svg class="icon" aria-hidden="true"><use href="#i-sun"></use></svg>
            <span data-i18n="settings.light"></span>
          </button>
          <button type="button" class="chip" data-theme-option="dark">
            <svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg>
            <span data-i18n="settings.dark"></span>
          </button>
        </div>
      </section>

      <section class="settings-group">
        <h3 data-i18n="settings.skin"></h3>
        <div class="chip-row theme-row skin-row">
          <button type="button" class="chip" data-skin-option="auto">
            <svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg>
            <span data-i18n="skin.auto"></span>
          </button>
          <button type="button" class="chip" data-skin-option="spring">
            <svg class="icon" aria-hidden="true"><use href="#i-flower"></use></svg>
            <span data-i18n="skin.spring"></span>
          </button>
          <button type="button" class="chip" data-skin-option="summer">
            <svg class="icon" aria-hidden="true"><use href="#i-sun"></use></svg>
            <span data-i18n="skin.summer"></span>
          </button>
          <button type="button" class="chip" data-skin-option="autumn">
            <svg class="icon" aria-hidden="true"><use href="#i-leaf"></use></svg>
            <span data-i18n="skin.autumn"></span>
          </button>
          <button type="button" class="chip" data-skin-option="winter">
            <svg class="icon" aria-hidden="true"><use href="#i-snow"></use></svg>
            <span data-i18n="skin.winter"></span>
          </button>
        </div>
      </section>

      <section class="settings-group">
        <h3 data-i18n="settings.language"></h3>
        <div id="settings-lang" class="chip-row"></div>
      </section>

      <!-- 지금 쓰는 버전(sw.js 의 CACHE_NAME). 새 버전이 반영됐는지 확인할 때 본다. -->
      <p id="app-version" class="app-version" hidden></p>
    </div>
  </dialog>

  <!-- 기록 리셋 확인 팝업. 설정 창 위에 한 겹 더 뜬다. 처음 포커스는 안전한 "취소"에 있다. -->
  <dialog id="confirm" class="settings confirm" aria-describedby="confirm-message">
    <div class="settings-body">
      <span class="confirm-icon" aria-hidden="true">
        <svg class="icon"><use href="#i-trash"></use></svg>
      </span>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" type="button" class="secondary" data-i18n="confirm.cancel"></button>
        <button id="confirm-ok" type="button" class="danger-button" data-i18n="confirm.delete"></button>
      </div>
    </div>
  </dialog>

  <script src="js/game.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
